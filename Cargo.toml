[workspace]
resolver = "3"
members = ["crates/*", "plugins/*", "benches"]

[workspace.package]
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
anyhow = "1.0"
divan = { version = "4", package = "codspeed-divan-compat" }
owo-colors = "4.3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27.0"
tracing = "0.1"
tracing-profile = "0.10"
tracing-subscriber = "0.3"

starship = { path = "crates/starship" }
starship-common = { path = "crates/common" }
starship-daemon = { path = "crates/daemon" }
starship-plugin-core = { path = "crates/plugin-core" }
starship-plugin-macros = { path = "crates/plugin-macros" }
starship-plugin-sdk = { path = "crates/plugin-sdk" }
starship-runtime = { path = "crates/runtime" }

[profile.release]
debug = 1

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = { level = "allow" }
missing_panics_doc = { level = "allow" }
must_use_candidate = { level = "allow" }
unreadable_literal = { level = "allow" }
